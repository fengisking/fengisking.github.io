<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">MaxWalkSpeed 生效链路</title>
  <desc id="desc">MaxWalkSpeed 是速度上限，通过 GetMaxSpeed 和 CalcVelocity 影响 Velocity，不是直接设置当前速度。</desc>
  <rect width="960" height="280" fill="#f7fafc"/>
  <text x="48" y="52" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="28" font-weight="700" fill="#1f2933">MaxWalkSpeed 不是当前速度</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#1f2933">
    <rect x="70" y="100" width="150" height="74" rx="8" fill="#fff" stroke="#6c9bd2"/><text x="100" y="143">切换步态</text>
    <rect x="280" y="100" width="150" height="74" rx="8" fill="#fff" stroke="#6c9bd2"/><text x="312" y="143">GetMaxSpeed</text>
    <rect x="490" y="100" width="150" height="74" rx="8" fill="#fff" stroke="#6c9bd2"/><text x="526" y="143">CalcVelocity</text>
    <rect x="700" y="100" width="150" height="74" rx="8" fill="#fff" stroke="#6c9bd2"/><text x="742" y="143">Velocity</text>
    <path d="M220 137h60M430 137h60M640 137h60" stroke="#486581" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="238" y="226" fill="#52606d">要立刻改变手感，需要同时考虑当前 Velocity、摩擦和制动</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#486581"/></marker></defs>
</svg>
