<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">UE Navigation 寻路链路</title>
  <desc id="desc">AI MoveTo 经过 NavigationSystem、RecastNavMesh 和 PathFollowingComponent，最终驱动 MovementComponent。</desc>
  <rect width="960" height="280" fill="#f6f8fb"/>
  <text x="48" y="52" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="28" font-weight="700" fill="#1b2638">UE Navigation 寻路链路</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#1b2638">
    <rect x="54" y="104" width="120" height="64" rx="8" fill="#fff" stroke="#5e9c76"/><text x="82" y="142">MoveTo</text>
    <rect x="214" y="104" width="150" height="64" rx="8" fill="#fff" stroke="#5e9c76"/><text x="242" y="142">NavigationSystem</text>
    <rect x="404" y="104" width="140" height="64" rx="8" fill="#fff" stroke="#5e9c76"/><text x="432" y="142">RecastNavMesh</text>
    <rect x="584" y="104" width="160" height="64" rx="8" fill="#fff" stroke="#5e9c76"/><text x="610" y="142">PathFollowing</text>
    <rect x="784" y="104" width="120" height="64" rx="8" fill="#fff" stroke="#5e9c76"/><text x="810" y="142">Movement</text>
    <path d="M174 136h40M364 136h40M544 136h40M744 136h40" stroke="#486581" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#486581"/></marker></defs>
</svg>
