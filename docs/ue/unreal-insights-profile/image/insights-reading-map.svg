<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Unreal Insights reading map">
  <rect width="960" height="420" fill="#111827"/>
  <text x="48" y="56" fill="#f9fafb" font-family="Arial, sans-serif" font-size="28" font-weight="700">Unreal Insights 阅读顺序</text>
  <g font-family="Arial, sans-serif" font-size="18">
    <rect x="48" y="100" width="170" height="78" rx="8" fill="#1f2937" stroke="#60a5fa"/>
    <text x="78" y="132" fill="#dbeafe">1. 找慢帧</text>
    <text x="78" y="158" fill="#93c5fd" font-size="14">Frame / Spike</text>
    <path d="M218 139 H285" stroke="#9ca3af" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="285" y="100" width="170" height="78" rx="8" fill="#1f2937" stroke="#34d399"/>
    <text x="315" y="132" fill="#d1fae5">2. 找线程</text>
    <text x="315" y="158" fill="#86efac" font-size="14">Game / Render / GPU</text>
    <path d="M455 139 H522" stroke="#9ca3af" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="522" y="100" width="170" height="78" rx="8" fill="#1f2937" stroke="#fbbf24"/>
    <text x="552" y="132" fill="#fef3c7">3. 展开事件</text>
    <text x="552" y="158" fill="#fde68a" font-size="14">Sort by Duration</text>
    <path d="M692 139 H759" stroke="#9ca3af" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="759" y="100" width="150" height="78" rx="8" fill="#1f2937" stroke="#f87171"/>
    <text x="784" y="132" fill="#fee2e2">4. 回源码</text>
    <text x="784" y="158" fill="#fecaca" font-size="14">TRACE_SCOPE</text>
    <rect x="48" y="240" width="250" height="92" rx="8" fill="#172554" stroke="#3b82f6"/>
    <text x="78" y="274" fill="#dbeafe">GameThread 高</text>
    <text x="78" y="302" fill="#bfdbfe" font-size="14">Tick / AI / Collision / Blueprint</text>
    <rect x="355" y="240" width="250" height="92" rx="8" fill="#064e3b" stroke="#10b981"/>
    <text x="385" y="274" fill="#d1fae5">RenderThread 高</text>
    <text x="385" y="302" fill="#a7f3d0" font-size="14">DrawCall / Shadow / Visibility</text>
    <rect x="662" y="240" width="247" height="92" rx="8" fill="#451a03" stroke="#f59e0b"/>
    <text x="692" y="274" fill="#ffedd5">DS 高</text>
    <text x="692" y="302" fill="#fed7aa" font-size="14">AI / Physics / Replication / RPC</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>

