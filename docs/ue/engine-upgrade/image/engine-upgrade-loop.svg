<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">UE 引擎升级闭环</title>
  <desc id="desc">引擎升级需要先固定旧版本基线，再切版本、修编译、验证资源、打包和性能对比。</desc>
  <rect width="960" height="300" fill="#f6f8fb"/>
  <text x="48" y="52" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="28" font-weight="700" fill="#1b2638">引擎升级是控制变量实验</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#1b2638">
    <rect x="58" y="104" width="130" height="66" rx="8" fill="#fff" stroke="#7aa2e3"/><text x="92" y="143">旧版基线</text>
    <rect x="238" y="104" width="130" height="66" rx="8" fill="#fff" stroke="#7aa2e3"/><text x="272" y="143">切引擎</text>
    <rect x="418" y="104" width="130" height="66" rx="8" fill="#fff" stroke="#7aa2e3"/><text x="452" y="143">修编译</text>
    <rect x="598" y="104" width="130" height="66" rx="8" fill="#fff" stroke="#7aa2e3"/><text x="632" y="143">跑地图</text>
    <rect x="778" y="104" width="130" height="66" rx="8" fill="#fff" stroke="#7aa2e3"/><text x="812" y="143">打包对比</text>
    <path d="M188 137h50M368 137h50M548 137h50M728 137h50" stroke="#486581" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="258" y="232" fill="#52606d">不要把引擎升级、插件更新和业务重构混在一个变量里</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#486581"/></marker></defs>
</svg>
